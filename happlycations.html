<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happlycations</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600&display=swap" />
    <link rel="stylesheet" href="css/happlycations.css?v=60" />
</head>

<body>
    <!-- a full-window page of its own, opened in a new tab from the home page as if it were another website.
         Left: the name, the three apps as a row of buttons, and the chosen app's text. Right: a rounded panel with its phone. -->
    <!-- sheep's wordmark outline: grow the letters by 2px, keep only that ring (the letters themselves go clear), colour it the sheep icon's blue -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <filter id="happlyOutline" x="-3%" y="-10%" width="106%" height="120%" color-interpolation-filters="sRGB">
            <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="grown" />
            <feComposite in="grown" in2="SourceAlpha" operator="out" result="ring" />
            <feFlood flood-color="#2F4AA3" result="ink" />
            <feComposite in="ink" in2="ring" operator="in" />
        </filter>
    </svg>

    <main class="happlyPage" data-app="drawl">
        <div class="happlyLeft">
            <h1 class="happlyHead">
                <span class="happlyHand" aria-hidden="true"></span>
                <span class="happlyWordWrap"><span class="happlyWord" role="img" aria-label="Happlycations"></span></span>
            </h1>


        </div>

        <!-- three tiers, one per app. Each shows its app icon as the hint; hover (or tap) one and its phone, title and button reveal.
             Each screen is a random grey for now; put an <img> or <video> inside .happlyScreen to fill it. -->
        <div class="happlyApps">
            <section class="happlySec on" data-app="drawl">
                <button class="happlyIcon" type="button" aria-label="drawl" aria-pressed="true"><img src="assets/homeAssets/drawl_app_icon.svg" alt="" /></button>
                <div class="happlyBody">
                    <div class="happlyPhone"><div class="happlyScreen"></div></div>
                    <h2 class="happlyTitle">drawl</h2>
                    <p class="happlySub">Consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore.</p>
                    <a class="happlyCta" href="#">Download drawl</a>
                </div>
            </section>
            <section class="happlySec" data-app="sheep">
                <button class="happlyIcon" type="button" aria-label="sheep" aria-pressed="false"><img src="assets/homeAssets/sheep_app_icon.svg" alt="" /></button>
                <div class="happlyBody">
                    <div class="happlyPhone"><div class="happlyScreen"></div></div>
                    <h2 class="happlyTitle">sheep</h2>
                    <p class="happlySub">Consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore.</p>
                    <a class="happlyCta" href="#">Download sheep</a>
                </div>
            </section>
            <section class="happlySec" data-app="habbot">
                <button class="happlyIcon" type="button" aria-label="habbot" aria-pressed="false"><img src="assets/homeAssets/habbot_app_icon.svg" alt="" /></button>
                <div class="happlyBody">
                    <div class="happlyPhone"><div class="happlyScreen"></div></div>
                    <h2 class="happlyTitle">habbot</h2>
                    <p class="happlySub">Consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore.</p>
                    <a class="happlyCta" href="#">Download habbot</a>
                </div>
            </section>
        </div>
    </main>

    <script>
        // a different random grey behind each phone's screen (kept apart so they never match)
        (function () {
            var used = [];
            document.querySelectorAll(".happlyScreen").forEach(function (el) {
                var l;
                do { l = 50 + Math.floor(Math.random() * 36); } while (used.some(function (u) { return Math.abs(u - l) < 8; }));
                used.push(l);
                el.style.background = "hsl(0 0% " + l + "%)";
            });
        })();

        // hovering or tapping an app's icon reveals that app (the last one stays open); the logo + wordmark fill follows it
        (function () {
            var page = document.querySelector(".happlyPage"), head = document.querySelector(".happlyHead");
            var secs = document.querySelectorAll(".happlySec"), token = 0, want = "drawl";
            var still = window.matchMedia("(prefers-reduced-motion: reduce)");
            function pick(app) {
                if (app === want) return;
                want = app;
                var me = ++token;
                secs.forEach(function (s) { var on = s.dataset.app === app; s.classList.toggle("on", on); s.querySelector(".happlyIcon").setAttribute("aria-pressed", on); });
                function swap() { page.setAttribute("data-app", app); }
                if (still.matches || !head.animate) { swap(); return; }
                head.getAnimations().forEach(function (a) { a.cancel(); });
                // the logo + wordmark: a subtle scale about their centre with a fade, out then in
                head.animate([{ transform: "scale(1)", opacity: 1 }, { transform: "scale(0.96)", opacity: 0 }], { duration: 140, easing: "ease-in", fill: "forwards" }).onfinish = function () {
                    if (me !== token) return;
                    swap();
                    head.animate([{ transform: "scale(0.96)", opacity: 0 }, { transform: "scale(1)", opacity: 1 }], { duration: 200, easing: "ease-out" }).onfinish = function () { head.getAnimations().forEach(function (x) { x.cancel(); }); };
                };
            }
            secs.forEach(function (s) {
                var go = function () { pick(s.dataset.app); };
                s.querySelector(".happlyIcon").addEventListener("click", go);
                s.querySelector(".happlyIcon").addEventListener("mouseenter", go);
                s.querySelector(".happlyIcon").addEventListener("focus", go);
            });
        })();
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>connorshopa : projects : happlycations</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600&display=swap" />
    <link rel="stylesheet" href="css/happlycations.css?v=6" />
</head>

<body>
    <!-- a full-window page of its own (not a card over the home page): the name at the top, the clay phone in the middle,
         the other apps along the bottom -->
    <a class="happlyClose" href="./index.html" aria-label="Back to the work">&times;</a>

    <main class="happlyPage">
        <h1 class="happlyHead">
            <img class="happlyHand" src="assets/homeAssets/happlycations_logo.svg" alt="" />
            <span class="happlyWord">Happlycations</span>
        </h1>

        <div class="clayMount" id="clay"></div>

        <div class="happlyApps">
            <span class="happlyApp"><img src="assets/homeAssets/drawl_app_icon.svg" alt="" /><span class="drawlText">drawl</span></span>
            <span class="happlyApp"><img src="assets/homeAssets/sheep_app_icon.svg" alt="" /><span class="sheepText">sheep</span></span>
            <span class="happlyApp"><img src="assets/homeAssets/habbot_app_icon.svg" alt="" /><span class="habbotMark" role="img" aria-label="habbot"></span></span>
        </div>
    </main>

    <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
    <script type="module">
        import { mountClayPhone } from "./js/clayphone.js";
        mountClayPhone(document.getElementById("clay"));
    </script>
    <script>
        document.addEventListener("keydown", function (e) { if (e.key === "Escape") window.location.href = "./index.html"; });
    </script>
</body>

</html>
